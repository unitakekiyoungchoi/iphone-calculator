<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>Calculator</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="phone">
  <div class="status" aria-hidden="true">
    <span id="clock">9:41</span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#fff"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.2C13.3 1.5 10.8.5 8 .5S2.7 1.5.8 3.4L2 4.6c1.6-1.5 3.7-2.4 6-2.4zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.2C11.5 4.6 9.8 3.9 8 3.9s-3.5.7-4.8 1.9L4.4 7c1-.9 2.2-1.4 3.6-1.4zm0 3.4c-.6 0-1.2.2-1.6.6L8 11.5l1.6-1.9c-.4-.4-1-.6-1.6-.6z"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#fff"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="#fff" opacity=".4"/></svg>
    </span>
  </div>
  <div class="calc">
    <div class="display" id="display" title="Swipe or press Backspace to delete">
      <span class="display-text" id="displayText" aria-live="polite">0</span>
    </div>
    <div class="keys" id="keys">
      <button class="key fn" data-key="clear" id="clearKey" aria-label="All clear">AC</button>
      <button class="key fn" data-key="sign" aria-label="Plus minus"><span class="sym pm">+/−</span></button>
      <button class="key fn" data-key="%" aria-label="Percent">%</button>
      <button class="key op" data-key="/" aria-label="Divide"><span class="sym">÷</span></button>

      <button class="key num" data-key="7">7</button>
      <button class="key num" data-key="8">8</button>
      <button class="key num" data-key="9">9</button>
      <button class="key op" data-key="*" aria-label="Multiply"><span class="sym">×</span></button>

      <button class="key num" data-key="4">4</button>
      <button class="key num" data-key="5">5</button>
      <button class="key num" data-key="6">6</button>
      <button class="key op" data-key="-" aria-label="Subtract"><span class="sym">−</span></button>

      <button class="key num" data-key="1">1</button>
      <button class="key num" data-key="2">2</button>
      <button class="key num" data-key="3">3</button>
      <button class="key op" data-key="+" aria-label="Add"><span class="sym">+</span></button>

      <button class="key num zero" data-key="0">0</button>
      <button class="key num" data-key=".">.</button>
      <button class="key op" data-key="=" aria-label="Equals"><span class="sym">=</span></button>
    </div>
  </div>
  <div class="home-bar" aria-hidden="true"></div>
</div>

<script src="calculator.js"></script>
<script src="app.js"></script>
</body>
</html>
